name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare web app
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 jspdf@2.5.1 pdfjs-dist@2.16.105
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
      - name: Create Android project
        run: |
          npx cap init PixPDF com.pixpdf.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PixPDF.apk
          gh release create "apk-${{ github.run_number }}" PixPDF.apk --title "PixPDF APK #${{ github.run_number }}" --notes "Download PixPDF.apk and install."
